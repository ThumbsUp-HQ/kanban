name: build-test-push

on:
  push:
    branches: [main]
  pull_request:

env:
  CI_JOB_NAME: build-test-push

jobs:
  build-test-push:
    runs-on: [inferrence1]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install system dependencies
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client
          fi

      - name: Run lint and checks
        shell: bash
        run: |
          scripts/ci/run_and_log.sh lint-type-license -- \
            bash -c 'uv sync --locked && make check && make license'

      - name: Start test database
        shell: bash
        run: |
          scripts/ci/run_and_log.sh testdb-up -- make testdb-up

      - name: Run tests
        shell: bash
        run: |
          scripts/ci/run_and_log.sh unit-tests -- \
            uv run pytest -q -m "not container"

      - name: Stop test database
        if: always()
        shell: bash
        run: |
          scripts/ci/run_and_log.sh testdb-down -- make testdb-down || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/thumbs-up-kanban:latest

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: |
          # Concatenate every per-step log into one body; never fail the job on upload problems.
          if [ -z "${DASH_TOKEN:-}" ]; then
            echo "Notice: DASH_TOKEN missing; skipping Dash upload"
            exit 0
          fi
          if ! ls ci-logs/*/*.log >/dev/null 2>&1; then
            echo "Notice: no ci-logs/*/*.log files to upload"
            exit 0
          fi
          for f in ci-logs/*/*.log; do
            printf '=== %s (exit %s) ===\n' "$f" "$(cat "${f%.log}.exit" 2>/dev/null || echo '?')"
            cat "$f"
          done > build.log
          echo "Uploading build.log to Dash..."
          curl -k -s -X POST "https://dash.hackedyour.info/api/logs?provider=forgejo&owner=AI&repo=thumbs-up-kanban" \
               -H "Authorization: Bearer ${DASH_TOKEN}" \
               -H "Content-Type: text/plain" \
               --data-binary @build.log || echo "Notice: Dash upload failed"
