name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sync dependencies
        shell: bash
        run: uv sync --locked

      - name: Lint and syntax checks
        shell: bash
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run lint-imports
          uv run python -m scripts.check_no_dashes --all
          uv run python -m database.migrations.cli check-migrations --static-only

      - name: Fast smoke unit tests
        shell: bash
        env:
          KB_TEST_SKIP_PG_CHECK: "1"
        run: |
          uv run pytest scripts/tests/test_ci_workflow.py scripts/tests/test_run_and_log.py scripts/tests/test_upload_dash_log.py tests/test_workspace_layout.py kanban/tests/ci/test_github_workflows.py kanban/tests/platform/test_brand_terminology_audit.py kanban/tests/docs/test_wiki_media_audit.py

  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install web dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint web application
        shell: bash
        run: pnpm --dir kanban/web lint

      - name: Typecheck
        shell: bash
        run: pnpm --dir kanban/web typecheck

      - name: Unit tests
        shell: bash
        run: pnpm --dir kanban/web test:unit

      - name: Build web application
        shell: bash
        run: pnpm --dir kanban/web build

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build runtime-slim image
        shell: bash
        run: docker buildx build --target runtime-slim --build-arg KB_GIT_COMMIT=${{ github.sha }} --build-arg KB_GIT_COMMIT_COUNT=$(git rev-list --count HEAD) -t kanban:runtime-slim --load .

      - name: Build standalone image
        shell: bash
        run: docker buildx build --target standalone --build-arg KB_GIT_COMMIT=${{ github.sha }} --build-arg KB_GIT_COMMIT_COUNT=$(git rev-list --count HEAD) -t kanban:standalone --load .

      - name: Verify built images
        shell: bash
        run: docker image ls kanban

  docker-publish:
    needs: [lint-and-syntax, web-smoke, docker-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Check Docker Hub credentials
        id: check-auth
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Notice: Docker Hub credentials not configured; skipping publish."
          fi

      - name: Log in to Docker Hub
        if: steps.check-auth.outputs.configured == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check-auth.outputs.configured == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/thumbs-up-kanban:latest
          build-args: |
            KB_GIT_COMMIT=${{ github.sha }}
