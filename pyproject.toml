[project]
name = "kanban-platform"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "kanban-database",
    "kanban-core",
    "kanban-mcp",
    "kanban-agent",
]

[tool.uv.workspace]
members = ["database", "kanban", "mcp", "agent"]

[tool.uv.sources]
kanban-database = { workspace = true }
kanban-core = { workspace = true }
kanban-mcp = { workspace = true }
kanban-agent = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "import-linter==2.16",
    "hatchling==1.33.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/tickets/publish_to_board.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211 (no blank line before class docstring)
    "D213",   # conflicts with D212 (multi-line summary first line)
    "COM812", # conflicts with ruff formatter
    "ISC001", # conflicts with ruff formatter
    "CPY001", # project copyright and license are declared centrally in LICENSE and NOTICE
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607"]     # assert, magic values, and subprocess calls in tests
"**/tests/**" = ["S101", "PLR2004", "S603", "S607"]  # assert, magic values, and subprocess calls in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
packages = ["database", "kanban", "mcp", "agent", "scripts"]

[tool.importlinter]
root_packages = ["agent", "mcp", "kanban", "database"]

[[tool.importlinter.contracts]]
name = "Unidirectional module layers agent -> mcp -> kanban -> database"
type = "layers"
layers = [
    "agent",
    "mcp",
    "kanban",
    "database",
]
