[project]
name = "kanban-platform"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "kanban-database",
    "kanban-core",
    "kanban-mcp",
    "kanban-agent",
    "wasmtime==50.0.1",
]

[project.urls]
Homepage = "https://github.com/ThumbsUp-HQ/kanban"
Repository = "https://github.com/ThumbsUp-HQ/kanban"
Issues = "https://github.com/ThumbsUp-HQ/kanban/issues"

[tool.uv.workspace]
members = ["database", "kanban", "mcp", "agent"]

[tool.uv.sources]
kanban-database = { workspace = true }
kanban-core = { workspace = true }
kanban-mcp = { workspace = true }
kanban-agent = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "import-linter==2.16",
    "hatchling==1.33.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-xdist==3.8.0",
    "pytest-socket==0.8.1",
    "pyyaml==6.0.3",
    "types-PyYAML==6.0.12.20261111",
    "types-defusedxml==0.7.0.20260504",
    "types-jsonschema==4.26.0.20261006",
    "pip-licenses==5.5.5",
    "httpx==0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/tickets/publish_to_board.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211 (no blank line before class docstring)
    "D213",   # conflicts with D212 (multi-line summary first line)
    "COM812", # conflicts with ruff formatter
    "ISC001", # conflicts with ruff formatter
    "CPY001", # project copyright and license are declared centrally in LICENSE and NOTICE
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607", "S108", "S105"]     # assert, magic values, subprocess calls, /tmp paths, and test credentials in tests
"**/tests/**" = ["S101", "PLR2004", "S603", "S607", "S108", "S105"]  # assert, magic values, subprocess calls, /tmp paths, and test credentials in tests
"database/testing/**" = ["S108", "ASYNC240"]                          # test harness uses /tmp sockets and initialization file reads
"kanban/reports/zip_packaging.py" = ["S303", "S305", "PLR2004", "TRY003", "EM101", "EM102", "B905", "D413"]  # WinZip AE-2 specification
"kanban/reports/renderers.py" = ["PLR0912", "PLR0915", "C901", "PLR2004", "TRY003", "EM101", "EM102", "ANN401", "E501", "ERA001", "PLR0911", "TC001", "D301", "D413", "FBT001", "FBT002", "Q003"]  # Multi-format document builders (PDF, OOXML, ODF, CSV)

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
packages = ["database", "kanban", "mcp", "agent", "scripts", "deploy"]

[[tool.mypy.overrides]]
module = ["pyasn1.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kanban.auth.ldap.asn1_ber"]
disallow_subclassing_any = false

[tool.coverage.run]
# SQLAlchemy asyncio runs coroutine frames inside greenlets; without this setting coverage.py
# loses line tracking after the first awaited DB call and under-reports service/route modules.
concurrency = ["greenlet", "thread"]
branch = true
omit = ["database/migrations/*", "database/tests/migrations/*"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket -p no:cacheprovider --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "committed_db: test commits real transactions; TRUNCATE cleanup applied",
    "migration: test runs alembic migrations against an isolated test database",
    "container: docker container integration test",
    "perf: performance SLA benchmark test",
]

[tool.importlinter]
root_packages = ["agent", "mcp", "kanban", "database"]

[[tool.importlinter.contracts]]
name = "Unidirectional module layers agent -> mcp -> kanban -> database"
type = "layers"
layers = [
    "agent",
    "mcp",
    "kanban",
    "database",
]
ignore_imports = [
    "kanban.app -> mcp.settings",
    "kanban.tests.mcp.** -> mcp.**",
    "kanban.tests.workflows.test_async_gate -> agent.**",
    "kanban.tests.security.test_security_model_contract -> mcp.app",
    "kanban.tests.security.test_security_model_contract -> agent.asgi",
]

[[tool.importlinter.contracts]]
name = "mcp forbidden from importing database"
type = "forbidden"
source_modules = ["mcp"]
forbidden_modules = ["database"]
ignore_imports = [
    "mcp.tests.** -> database.**",
    "mcp.tests.** -> kanban.**",
]
