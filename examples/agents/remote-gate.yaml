slug: remote-gate
display_name: "Remote Runner Transition Gate"
harness_kind: remote_runner
remote_runner_pool_slug: default-runners
cli_binary_allowlist_id: codex
cli_args:
  - "exec"
  - "-s"
  - "read-only"
  - "-"
repo_access_mode: ro_vfs_mount
mcp_allowed_tools:
  - search_tickets
  - read_ticket
allowed_mutable_fields:
  - labels
  - priority
system_instructions_md: |
  You are an automated remote runner transition gate reviewer.
  Inspect remote test executions, coverage artifacts, and security compliance.
timeout_ms: 60000
