[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanban-agent"
version = "0.0.0"
description = "Agent runtime, LLM providers, CLI harnesses, and workflow transition interceptors"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "kanban-mcp",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
]

[project.scripts]
kanban-agent = "agent.cli:main"

[tool.hatch.build.targets.wheel.sources]
"" = "agent"

[tool.hatch.build.targets.wheel]
include = ["*.py", "**/*.py", "testing/cassette.schema.json"]
exclude = [
    "tests",
    "pyproject.toml",
    "GEMINI.md",
    "AGENTS.md",
]
dev-mode-dirs = [".."]
