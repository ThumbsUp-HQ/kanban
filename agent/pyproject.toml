[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanban-agent"
version = "0.0.0"
description = "Agent runtime, LLM providers, CLI harnesses, and workflow transition interceptors"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "kanban-mcp",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "httpx==0.28.1",
    "google-genai==3.2.0",
    "openai==3.49.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
]

[project.scripts]
kanban-agent = "agent.cli:main"
kanban-agent-runner = "agent.remote_runner.cli:main"

[tool.hatch.build.targets.wheel.sources]
"" = "agent"

[tool.hatch.build.targets.wheel]
include = ["*.py", "**/*.py", "testing/cassette.schema.json", "schemas/*.json"]
exclude = [
    "tests",
    "pyproject.toml",
    "GEMINI.md",
    "AGENTS.md",
]
dev-mode-dirs = [".."]
