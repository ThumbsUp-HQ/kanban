[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanban-mcp"
version = "0.0.0"
description = "Model Context Protocol server exposing agent, docs, and admin surfaces"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "kanban-core",
    "httpx==0.28.1",
    "h2==4.4.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
    "starlette>=0.40.0",
]

[project.scripts]
kanban-cli = "mcp.cli.main:main"
kanban-cli-agent = "mcp.cli.main:main_agent"
kanban-cli-docs = "mcp.cli.main:main_docs"
kanban-cli-admin = "mcp.cli.main:main_admin"

[tool.hatch.build.targets.wheel.sources]
"" = "mcp"

[tool.hatch.build.targets.wheel]
include = ["*.py", "**/*.py"]
exclude = [
    "tests",
    "pyproject.toml",
    "GEMINI.md",
    "AGENTS.md",
]
dev-mode-dirs = [".."]
