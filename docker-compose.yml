services:
  reverse-proxy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 100
    mem_limit: 256m
    tmpfs:
      - /tmp
      - /var/run
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - edge_net
      - app_net
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - web_dist:/srv/www:ro
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      KB_DOMAIN: "${KB_DOMAIN:-localhost}"

  kanban-api:
    build:
      context: .
      target: runtime-slim
    image: kanban:runtime-slim
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 200
    mem_limit: 512m
    tmpfs:
      - /tmp
    command:
      - "uvicorn"
      - "kanban.app:create_app"
      - "--factory"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--proxy-headers"
      - "--forwarded-allow-ips=*"
    networks:
      - app_net
      - data_net
    depends_on:
      postgres:
        condition: service_healthy
      kanban-migrate:
        condition: service_completed_successfully
    secrets:
      - postgres_password
      - master_kek

  kanban-migrate:
    image: kanban:runtime-slim
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 100
    mem_limit: 256m
    tmpfs:
      - /tmp
    command: ["alembic", "upgrade", "head"]
    networks:
      - data_net
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password

  mcp-server:
    image: kanban:runtime-slim
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 100
    mem_limit: 512m
    tmpfs:
      - /tmp
    command: ["python", "-m", "kanban.mcp_placeholder"]
    networks:
      - app_net

  agent-runtime:
    image: kanban:runtime-slim
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 100
    mem_limit: 1024m
    tmpfs:
      - /tmp
    command: ["python", "-m", "kanban.agent_placeholder"]
    networks:
      - app_net
      - egress_llm_net

  script-sandbox:
    image: kanban:sandbox
    profiles:
      - sandbox
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 50
    mem_limit: 256m
    tmpfs:
      - /tmp
    networks:
      - sandbox_net

  outbox-relay:
    image: kanban:runtime-slim
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 100
    mem_limit: 256m
    tmpfs:
      - /tmp
    command: ["python", "-m", "database.outbox.relay"]
    networks:
      - data_net
    depends_on:
      kanban-migrate:
        condition: service_completed_successfully
    secrets:
      - postgres_password

  postgres:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 200
    mem_limit: 1024m
    tmpfs:
      - /tmp
      - /var/run/postgresql
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "kanban"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_password"
    networks:
      - data_net
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.0-alpine@sha256:19f0b3d350f5e6de618086d79ecdc9c474ab159bebb16ed95a92e4211562fee5
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 100
    mem_limit: 256m
    tmpfs:
      - /tmp
    volumes:
      - valkeydata:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  edge_net:
    driver: bridge
  app_net:
    internal: true
  data_net:
    internal: true
  sandbox_net:
    internal: true
  egress_llm_net:
    driver: bridge

secrets:
  postgres_password:
    file: ./deploy/secrets/postgres_password.txt
  master_kek:
    file: ./deploy/secrets/master_kek.txt

volumes:
  caddy_data:
  caddy_config:
  web_dist:
  pgdata:
  valkeydata:
