  proposed_title: "Authentication Architecture and Multi-Card Flow"
  summary_markdown: "Technical specification for enterprise multi-card authentication, local break-glass admin, and OAuth federation."
  sections:
    - heading: "Overview and Scope"
      level: 2
      body_markdown: "This document defines the authentication architecture supporting enterprise multi-card login cards, local administrator break-glass access, and identity provider federation (tracking #KAN-101 and #KAN-102)."
    - heading: "Authentication Flow"
      level: 2
      body_markdown: |
        The following sequence diagram illustrates the OIDC authorization code flow with PKCE S256:

        ```mermaid
        sequenceDiagram
            autonumber
            actor User as User Browser
            participant App as Kanban Web
            participant Auth as Auth Service
            participant IdP as Identity Provider
            User->>App: Click Login with OIDC
            App->>Auth: Initiate OAuth Flow (PKCE S256)
            Auth->>IdP: Redirect to IdP Auth URL
            IdP-->>User: Present Login Challenge
            User->>IdP: Provide Credentials
            IdP-->>Auth: Callback with Authorization Code
            Auth->>IdP: Exchange Code + PKCE Verifier for Tokens
            IdP-->>Auth: ID Token + Access Token
            Auth->>App: Issue Session Cookie
            App-->>User: Render Dashboard
        ```
    - heading: "Security Invariants"
      level: 2
      body_markdown: "All authentication operations enforce timing-safe comparison, cryptographic nonce binding, and strict rate limiting."
