cassette_version: 1
matcher: {}
http_exchanges:
  - request:
      method: POST
      path: /v1/chat/completions
      json_contains:
        model: gpt-4o-mini
        store: false
        stream: true
    response:
      status: 200
      headers:
        content-type: text/event-stream
      sse_chunks:
        - '{"id": "chatcmpl-stream-1", "object": "chat.completion.chunk", "created": 1700000000, "model": "gpt-4o-mini", "choices": [{"index": 0, "delta": {"content": "Hello"}, "finish_reason": null}]}'
        - '{"id": "chatcmpl-stream-1", "object": "chat.completion.chunk", "created": 1700000000, "model": "gpt-4o-mini", "choices": [{"index": 0, "delta": {"content": " Sparkle"}, "finish_reason": "stop"}], "usage": {"prompt_tokens": 10, "completion_tokens": 5}}'
        - '[DONE]'
