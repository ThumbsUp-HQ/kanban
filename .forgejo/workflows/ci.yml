name: build-test-push

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: lint-type
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Lint and type checks (cached ci-base)
        shell: bash
        run: |
          scripts/ci/run_and_log.sh make-check -- \
            scripts/ci/with_ci_base.sh 'uv sync --locked --no-build-isolation && make check'

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh lint-type

  python-tests:
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: python-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Start test database
        shell: bash
        run: scripts/ci/run_and_log.sh testdb-up -- make testdb-up

      - name: Run tests with coverage (cached ci-base)
        shell: bash
        run: |
          mkdir -p reports
          scripts/ci/run_and_log.sh pytest -- \
            scripts/ci/with_ci_base.sh '
              uv sync --locked --no-build-isolation &&
              uv run --no-sync pytest -n 4 --dist=loadscope \
                --ignore=tests/perf \
                --ignore=tests/security \
                --ignore=database/tests/migrations \
                --ignore=database/tests/test_migration_modules.py \
                --ignore=database/tests/test_migration_wip_limits.py \
                --ignore=database/tests/test_p3_17_search_migration.py \
                --ignore=tests/deploy/test_standalone_container.py \
                --cov=database --cov=kanban --cov=mcp --cov=agent --cov=scripts \
                --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage.xml \
                --cov-fail-under=95 --junitxml=reports/pytest.xml
            '

      - name: Stop test database
        if: always()
        shell: bash
        run: scripts/ci/run_and_log.sh testdb-down -- make testdb-down || true

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh python-tests

  stride-security-gate:
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: stride-security-gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Start test database
        shell: bash
        run: scripts/ci/run_and_log.sh testdb-up -- make testdb-up

      - name: Run STRIDE security and DDL migration lifecycle tests (cached ci-base)
        shell: bash
        run: |
          scripts/ci/run_and_log.sh stride-tests -- \
            scripts/ci/with_ci_base.sh '
              uv sync --locked --no-build-isolation &&
              uv run --no-sync pytest tests/security database/tests/migrations \
                database/tests/test_migration_modules.py \
                database/tests/test_migration_wip_limits.py \
                database/tests/test_p3_17_search_migration.py -q
            '

      - name: Stop test database
        if: always()
        shell: bash
        run: scripts/ci/run_and_log.sh testdb-down -- make testdb-down || true

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh stride-security-gate

  web-tests:
    needs: [docker-build]
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: web-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run web typecheck, lint, unit tests, and build (cached ci-base)
        shell: bash
        run: |
          scripts/ci/run_and_log.sh web-suite -- \
            scripts/ci/with_ci_base.sh '
              pnpm install --frozen-lockfile --ignore-scripts --prefer-offline --store-dir /opt/ci-cache/pnpm-store &&
              pnpm --dir kanban/web typecheck &&
              pnpm --dir kanban/web lint &&
              pnpm --dir kanban/web test:unit --coverage &&
              pnpm --dir kanban/web build
            '

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh web-tests

  license-gate:
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: license-gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: License gate (cached ci-base)
        shell: bash
        run: |
          scripts/ci/run_and_log.sh license -- \
            scripts/ci/with_ci_base.sh '
              uv sync --locked --no-build-isolation &&
              pnpm install --frozen-lockfile --ignore-scripts --prefer-offline --store-dir /opt/ci-cache/pnpm-store &&
              make license
            '

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh license-gate

  docker-build:
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Warm cached ci-base image
        shell: bash
        run: |
          scripts/ci/run_and_log.sh build-ci-base -- \
            scripts/ci/with_ci_base.sh 'python3 --version && uv --version && node --version && pnpm --version'

      - name: Build runtime-slim image
        shell: bash
        run: |
          scripts/ci/run_and_log.sh build-runtime-slim -- \
            docker buildx build --target runtime-slim -t kanban:runtime-slim --load .

      - name: Build standalone image
        shell: bash
        run: |
          scripts/ci/run_and_log.sh build-standalone -- \
            docker buildx build --target standalone -t kanban:standalone --load .

      - name: List built images
        shell: bash
        run: scripts/ci/run_and_log.sh image-list -- docker image ls kanban

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh docker-build

  perf-budgets:
    needs: [docker-build]
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: perf-budgets
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Start test database
        shell: bash
        run: scripts/ci/run_and_log.sh testdb-up -- make testdb-up

      - name: Run SLA Performance Budget Gate (cached ci-base)
        shell: bash
        run: |
          scripts/ci/run_and_log.sh perf-budgets -- \
            scripts/ci/with_ci_base.sh '
              uv sync --locked --no-build-isolation &&
              uv run --no-sync pytest tests/perf/test_perf_sparkle_sla.py tests/perf/test_perf_sync_hooks_sla.py tests/perf/test_perf_budget_gate_unit.py tests/perf/test_perf_clean_db_1000.py -q &&
              uv run --no-sync python scripts/perf_budget_gate.py --evaluate-only docs/qa/KANBA-151 --report-out docs/qa/KANBA-151/perf-report.json
            '

      - name: Stop test database
        if: always()
        shell: bash
        run: scripts/ci/run_and_log.sh testdb-down -- make testdb-down || true

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh perf-budgets

  docker-push:
    needs: [lint-type, python-tests, stride-security-gate, web-tests, license-gate, docker-build, perf-budgets]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: docker-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Record push context
        shell: bash
        run: |
          scripts/ci/run_and_log.sh push-context -- git log -1 --format=%H%n%s

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/thumbs-up-kanban:latest

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh docker-push
