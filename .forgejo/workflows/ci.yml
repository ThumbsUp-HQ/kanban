name: build-test-push

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-push:
    runs-on: [inferrence1]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run lint and checks
        shell: bash
        run: |
          set -o pipefail
          echo "=== Lint, Type Checks, and License Gate ===" >> build.log
          (uv sync --locked && make check && make license) 2>&1 | tee -a build.log

      - name: Start test database
        shell: bash
        run: |
          set -o pipefail
          echo "=== Test Database Startup ===" >> build.log
          make testdb-up 2>&1 | tee -a build.log
          echo "=== Runner Diagnostics ===" >> build.log
          id >> build.log
          pwd >> build.log
          ls -la /tmp >> build.log
          ls -la /tmp/kb-pgsock >> build.log || true
          docker inspect thumbs-up-kanban-pg-test-1 | grep -A 10 Mounts >> build.log || true

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          echo "=== Unit Tests ===" >> build.log
          (uv run pytest -q) 2>&1 | tee -a build.log

      - name: Stop test database
        if: always()
        shell: bash
        run: |
          make testdb-down 2>&1 | tee -a build.log || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/thumbs-up-kanban:latest

      - name: Upload logs to Dash
        if: always()
        shell: bash
        run: |
          TOKEN="${{ secrets.DASH_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${DASH_TOKEN:-}"
          fi
          if [ -f build.log ] && [ -n "$TOKEN" ]; then
            echo "Uploading build.log to Dash..."
            curl -k -s -X POST "https://dash.hackedyour.info/api/logs?provider=forgejo&owner=AI&repo=thumbs-up-kanban" \
                 -H "Authorization: Bearer ${TOKEN}" \
                 -H "Content-Type: text/plain" \
                 --data-binary @build.log
          else
            echo "Notice: build.log or DASH_TOKEN missing (TOKEN length: ${#TOKEN})"
          fi
