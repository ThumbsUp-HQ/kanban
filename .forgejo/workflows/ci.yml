name: build-test-push

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-type:
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: lint-type
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Lint and type checks
        shell: bash
        run: |
          scripts/ci/run_and_log.sh make-check -- \
            bash -c 'uv sync --locked && make check'

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh lint-type

      - name: Upload CI logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-${{ github.job }}
          path: ci-logs/
          retention-days: 14
          if-no-files-found: error
        continue-on-error: true

  python-tests:
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: python-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install system dependencies
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client
          fi

      - name: Sync Python dependencies
        shell: bash
        run: scripts/ci/run_and_log.sh uv-sync -- uv sync --locked

      - name: Start test database
        shell: bash
        run: scripts/ci/run_and_log.sh testdb-up -- make testdb-up

      - name: Run tests with coverage
        shell: bash
        run: |
          mkdir -p reports
          scripts/ci/run_and_log.sh pytest -- \
            uv run pytest -n auto -m "not container" \
              --cov=database --cov=kanban --cov=mcp --cov=agent --cov=scripts \
              --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage.xml \
              --cov-fail-under=95 --junitxml=reports/pytest.xml

      - name: Stop test database
        if: always()
        shell: bash
        run: scripts/ci/run_and_log.sh testdb-down -- make testdb-down || true

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh python-tests

      - name: Upload test reports artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports-python-tests
          path: reports/
          retention-days: 14
          if-no-files-found: warn
        continue-on-error: true

      - name: Upload CI logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-${{ github.job }}
          path: ci-logs/
          retention-days: 14
          if-no-files-found: error
        continue-on-error: true

  web-tests:
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: web-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install web dependencies
        shell: bash
        run: |
          scripts/ci/run_and_log.sh pnpm-install -- \
            pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        shell: bash
        run: scripts/ci/run_and_log.sh typecheck -- pnpm --dir kanban/web typecheck

      - name: Lint
        shell: bash
        run: scripts/ci/run_and_log.sh lint -- pnpm --dir kanban/web lint

      - name: Unit tests with coverage
        shell: bash
        run: scripts/ci/run_and_log.sh unit-tests -- pnpm --dir kanban/web test:unit --coverage

      - name: Build
        shell: bash
        run: scripts/ci/run_and_log.sh build -- pnpm --dir kanban/web build

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh web-tests

      - name: Upload CI logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-${{ github.job }}
          path: ci-logs/
          retention-days: 14
          if-no-files-found: error
        continue-on-error: true

  license-gate:
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: license-gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: License gate
        shell: bash
        run: |
          scripts/ci/run_and_log.sh license -- \
            bash -c 'uv sync --locked && pnpm install --frozen-lockfile --ignore-scripts && make license'

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh license-gate

      - name: Upload CI logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-${{ github.job }}
          path: ci-logs/
          retention-days: 14
          if-no-files-found: error
        continue-on-error: true

  docker-build:
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build runtime-slim image
        shell: bash
        run: |
          scripts/ci/run_and_log.sh build-runtime-slim -- \
            docker buildx build --target runtime-slim -t kanban:runtime-slim --load .

      - name: Build standalone image
        shell: bash
        run: |
          scripts/ci/run_and_log.sh build-standalone -- \
            docker buildx build --target standalone -t kanban:standalone --load .

      - name: List built images
        shell: bash
        run: scripts/ci/run_and_log.sh image-list -- docker image ls kanban

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh docker-build

      - name: Upload CI logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-${{ github.job }}
          path: ci-logs/
          retention-days: 14
          if-no-files-found: error
        continue-on-error: true

  docker-push:
    needs: [lint-type, python-tests, web-tests, license-gate, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [inferrence1]
    timeout-minutes: 20
    env:
      CI_JOB_NAME: docker-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Record push context
        shell: bash
        run: |
          scripts/ci/run_and_log.sh push-context -- git log -1 --format=%H%n%s

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/thumbs-up-kanban:latest

      - name: Upload logs to Dash
        if: always()
        shell: bash
        env:
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: scripts/ci/upload_dash_log.sh docker-push

      - name: Upload CI logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-${{ github.job }}
          path: ci-logs/
          retention-days: 14
          if-no-files-found: error
        continue-on-error: true
