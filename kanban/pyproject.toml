[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanban-core"
version = "0.0.0"
description = "Kanban web application, REST/WS APIs, auth, and state machines"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi==0.162.5",
    "kanban-database",
    "pydantic-settings==2.16.2",
    "uvicorn[standard]==0.54.0",
]

[tool.hatch.build.targets.wheel.sources]
"" = "kanban"

[tool.hatch.build.targets.wheel]
include = ["*.py", "**/*.py"]
exclude = [
    "tests",
    "pyproject.toml",
    "GEMINI.md",
    "AGENTS.md",
]
dev-mode-dirs = [".."]
