[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanban-core"
version = "0.0.0"
description = "Kanban web application, REST/WS APIs, auth, and state machines"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "defusedxml==0.7.1",
    "fastapi==0.162.5",
    "httpx==0.28.1",
    "joserfc==1.8.0",
    "kanban-database",
    "nh3==0.3.7",
    "pillow==13.0.0",
    "pydantic-settings==2.16.2",
    "uvicorn[standard]==0.54.0",
    "webauthn==3.0.1",
]

[project.scripts]
kanban-ctl = "kanban.cli.ctl:main"

[tool.hatch.build.targets.wheel.sources]
"" = "kanban"

[tool.hatch.build.targets.wheel]
include = ["*.py", "**/*.py"]
exclude = [
    "tests",
    "pyproject.toml",
    "GEMINI.md",
    "AGENTS.md",
]
dev-mode-dirs = [".."]
