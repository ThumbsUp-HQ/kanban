[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanban-database"
version = "0.0.0"
description = "Universal Object Graph, FORCE RLS, Link Auditor, and PostgreSQL schema for Kanban platform"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = []

[tool.hatch.build.targets.wheel.sources]
"" = "database"

[tool.hatch.build.targets.wheel]
include = ["*.py", "**/*.py"]
exclude = [
    "tests",
    "pyproject.toml",
    "GEMINI.md",
    "AGENTS.md",
]
dev-mode-dirs = [".."]
