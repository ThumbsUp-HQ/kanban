search_help:
  tool: search
  surface: /mcp/docs
  purpose: CLI-modeled unified search, id read, and tree inspector
  arguments: {id: help}
  response:
    tool: search
    surface: /mcp/docs
    version: 2.0.0
    help:
      description: Search and inspect knowledge base documents, pages, and sticky notes.
      modes:
        help: search(id="help") -> Surface usage documentation
        read_by_id: search(id="docs/architecture", lod="standard"|"full", include_tree=true) -> Single document, page, or
          sticky node with breadcrumbs, outline, and links
        hybrid_search: search(query="OAuth PKCE", type="ALL"|"DOC"|"STICKY", project="ARCH", limit=20, cursor=...) -> Ranked
          matches with snippets and anchors
        project_list: search(project="ARCH", type="ALL"|"DOC"|"STICKY", include_tree=false) -> Listing of documents and stickies
          within project
        workspace_list: search(type="ALL"|"DOC"|"STICKY") -> Listing across entire workspace
      parameters:
        id: string (canonical key, path, or UUID; or "help")
        query: string (1-500 chars for hybrid semantic/fulltext search)
        type: '"ALL" | "DOC" | "STICKY" (default ALL)'
        project: string (project identifier key or UUID)
        lod: '"summary" | "standard" | "full" (default standard)'
        include_tree: boolean (embed hierarchy tree on doc/project, default false)
        limit: integer (1-100, default 20)
        cursor: string (opaque pagination cursor)
search_read_doc_standard:
  tool: search
  arguments: {id: docs/architecture/auth-studio, lod: standard}
  response:
    kind: page
    key: docs/architecture/auth-studio
    title: Auth Studio
    version_seq: 2
    breadcrumbs: [Architecture, Auth Studio]
    access_pill: project
    etag: e9b2512f46849492837482818
    body_markdown: |-
      ## PKCE S256
      Hardened PKCE token verification.

      ## Overview
      Authentication overview.
    outline: [PKCE S256, Overview]
create_doc:
  tool: create
  arguments:
    type: DOC
    title: Architecture
    project: ARCH
    content: |-
      # Architecture
      Overview of system architecture.
    links: ['+REL:ARCH-1']
  response:
    status: created
    kind: doc
    id: 0193457a-1111-7000-8000-000000000001
    key: docs/architecture
    title: Architecture
    version_seq: 1
    etag: 6a7f8e9d0c1b2a345678
    links: [{action: added, target: ARCH-1, link_type: RELATES_TO}]
